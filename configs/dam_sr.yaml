model: dam
data_root: data/
geometry: diamond

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  # Hiérarchie : HR (0.025) → 0.05 → 0.1 (self-attention globale au niveau le plus grossier)
  levels: [0.05, 0.1]
  embed_dim: 64
  cond_dim: 64
  n_heads: 2            # 64/4=16 dims/tête
  n_global_blocks: 3
  mlp_ratio: 4
  k_pool: 9             # voisins pour le pooling (fin → grossier)
  k_up: 6               # voisins pour l'unpooling (grossier → fin)
  k_self: 9             # self-attention locale au niveau HR
  k_cond: 6             # voisins IDW pour le conditionnement LR par niveau
  use_lr_grad: true     # gradient de pression + div(u) du maillage LR comme entrée
  use_bf16: true

training:
  epochs: 150
  lr: 5.0e-4
  weight_decay: 1.0e-4
  val_every: 10
  seed: 42
  loss: shock_weighted_rel_mse
  schedule: cosine
  warmup_epochs: 20
  grad_clip: 1.0
  save_best: true
  batch_size: 16
  huber_delta: 1.0
  ema_decay: 0.9995
  preload: true
