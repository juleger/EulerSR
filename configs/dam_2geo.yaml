model: dam
data_root: data/

# DAM 2 geometries (diamond + naca0012), etape intermediaire vers le 6geo.
#
# Repro : uv run python train.py --config configs/dam_2geo.yaml --run_name dam_2geo

architecture:
  levels: [0.05, 0.1]     # niveaux de pooling multi-echelle internes
  embed_dim: 128
  cond_dim: 128           # dimension du vecteur de conditionnement
  n_heads: 4
  n_hr_blocks: 2          # blocs d'attention a pleine resolution HR
  n_global_blocks: 3      # blocs d'attention globale au niveau grossier
  mlp_ratio: 4
  k_pool: 9               # voisins kNN pour le pooling
  k_up: 6                 # voisins kNN pour l'upsampling
  k_self: 9               # voisins kNN pour la self-attention
  k_cond: 6               # voisins kNN pour le conditionnement
  use_lr_grad: true       # ajoute les gradients LR en features d'entree
  use_bf16: true
  coord_norm: object      # centre/echelle sur corde+centre obstacle (cf euler/meshing)
  use_geom_cond: true     # embedding de geometrie, avec dropout CFG (geom_cfg_prob)
  n_geoms: 2              # nombre de geometries distinctes (auto-recalcule par train.py)
  geom_cfg_prob: 0.25     # meilleur sur le sweep 6geo 0.15/0.25/0.35 (OOD-geometrie)

resolution:
  hr: 0.025
  lr: 0.1

# Entrainement multi-branche : une branche = (geometrie, resolution LR).
datasets:
  - name: diamond
    lr_res:         0.1
    weight:         2
    train_fraction: 1.0

  - name: naca0012
    lr_res:         0.1
    weight:         2
    train_fraction: 1.0

training:
  epochs: 200
  lr: 5.0e-4
  weight_decay: 5.0e-4
  val_every: 20
  seed: 42
  loss: shock_weighted_rel_mse   # options: mse, rel_mse, shock_weighted_mse, shock_weighted_rel_mse, w2
  shock_weight_factor: 1.0       # poids des zones de choc dans la loss (0 = uniforme)
  lambda_enthalpy: 0.01          # poids de la perte de conservation d'enthalpie (0 = desactive)
  schedule: cosine               # options: cosine, constant
  warmup_epochs: 20
  grad_clip: 2.0                 # clipping de la norme du gradient (0 = desactive)
  save_best: true
  batch_size: 12                 # A ajuster selon GPU et Modèle (8 sur A40, 12 sur L40, 24 sur H100 environ)
  ema_decay: 0.999
  train_fraction: 1.0
  preload: true                  # pool 2geo assez petit (contrairement au 6geo, preload=false)
  mach_range: [0.7, 3.0]         # store processed regenere jusqu'a Mach 3
