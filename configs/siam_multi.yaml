model: siam
data_root: data/

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  levels: [0.05, 0.1]     # niveaux de pooling multi-echelle internes
  embed_dim: 96
  cond_dim: 128           # dimension du vecteur de conditionnement
  t_dim: 64               # dimension de l'embedding du temps de pont
  n_heads: 3
  n_hr_blocks: 2          # blocs d'attention a pleine resolution HR
  n_global_blocks: 3      # blocs d'attention globale au niveau grossier
  mlp_ratio: 4
  k_pool: 9               # voisins kNN pour le pooling
  k_up: 6                 # voisins kNN pour l'upsampling
  k_self: 9               # voisins kNN pour la self-attention
  k_cond: 6               # voisins kNN pour le conditionnement
  use_lr_grad: true       # ajoute les gradients LR en features d'entree
  use_bf16: true
  use_geom_cond: false    # embedding de geometrie
  n_geoms: 2              # nombre de geometries distinctes

flow:
  n_steps: 8              # pas d'integration ODE (pont court : peu de pas suffisent)
  n_samples: 1
  n_val_gen: 16           # nombre de cas evalues en validation
  sample_seed: 42
  # Interpolant : x_t = alpha(t) x0 + beta(t) x1 + gamma(t) z  (Albergo et al. 2023)
  path: linear            # chemin alpha/beta LR IDW -> HR. options: linear, trig
  gamma: sin              # enveloppe de bruit gamma(t). options: sin (sigma sin(pi t)), sqrt (sigma sqrt(t(1-t)))
  sigma_bridge: 0.1       # sigma : facteur d'echelle du bruit z du pont
  t_dist: logit_normal    # distribution du temps d'entrainement. options: logit_normal, uniform, beta
  sigma_t: 1.2            # ecart-type du temps si t_dist = logit_normal
  use_residual: true      # residu type DAM : sortie = IDW + delta (pas de res_scale)
  cfg_prob: 0.1           # proba de dropout du conditionnement a l'entrainement (0 = desactive)
  cfg_scale: 1.0          # echelle de guidance a l'inference (1 = desactive)

datasets:
  - name: diamond
    lr_res:         [0.05, 0.1, 0.2]
    weight:         [2,    2,   2]
    train_fraction: [1.0,  1.0, 1.0]

  - name: naca0012
    lr_res:         [0.1, 0.2]
    weight:         [3,   3]
    train_fraction: [1.0, 1.0]

training:
  epochs: 250
  lr: 5.0e-4
  weight_decay: 5.0e-4
  val_every: 20
  seed: 42
  loss: shock_weighted_rel_mse   # options: mse, rel_mse, shock_weighted_mse, shock_weighted_rel_mse, sliced_wasserstein
  shock_weight_factor: 1.0       # poids des zones de choc dans la loss (0 = uniforme)
  lambda_enthalpy: 0.0           # physique a l'entrainement (ponderee par t) ; 0 = desactive
  schedule: cosine               # options: cosine, constant
  warmup_epochs: 20
  grad_clip: 4.0                 # clipping de la norme du gradient (0 = desactive)
  save_best: true
  batch_size: 16
  ema_decay: 0.9995
  train_fraction: 1.0
  preload: true
