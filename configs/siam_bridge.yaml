model: siam
data_root: data/
geometry: diamond

# SIAM en VRAI pont espace-champ (IDW -> HR), par opposition au mode residu (x0=0).
#   x_t = alpha(t) IDW + beta(t) HR + gamma(t) (rs*z)   (pont brownien, bouts epingles)
# - source = champ IDW (physique, a support : varie d'une condition a l'autre) -> pas de Dirac
# - x_t reste O(1) et informatif a tout t (a t=0, x_t = IDW), equilibre par mu/sig
# - la vitesse cible est normalisee par canal (/rs) -> sortie reseau equilibree (u ~ v ~ rho ~ p)
# A comparer a FAM (bruit->residu) et DAM (regression directe) sur : L2 in-dist, OOD, chocs, few-step.

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  levels: [0.05, 0.1]     # niveaux de pooling multi-echelle internes
  embed_dim: 96
  cond_dim: 96           # dimension du vecteur de conditionnement
  t_dim: 64               # dimension de l'embedding du temps de pont
  n_heads: 3
  n_hr_blocks: 2          # blocs d'attention a pleine resolution HR
  n_global_blocks: 3      # blocs d'attention globale au niveau grossier
  mlp_ratio: 4
  k_pool: 9               # voisins kNN pour le pooling
  k_up: 6                 # voisins kNN pour l'upsampling
  k_self: 9               # voisins kNN pour la self-attention
  k_cond: 6               # voisins kNN pour le conditionnement
  use_lr_grad: true       # ajoute les gradients LR en features d'entree
  use_bf16: true

flow:
  n_steps: 16              # pas d'integration PF-ODE (pont court : peu de pas suffisent)
  n_samples: 1             # PF-ODE deterministe : un echantillon suffit
  n_val_gen: 16            # nombre de cas evalues en validation
  sample_seed: 42
  # Interpolant : x_t = alpha(t) x0 + beta(t) x1 + gamma(t) z  (Albergo et al. 2023)
  path: linear             # chemin alpha/beta IDW -> HR. options: linear, trig
  gamma: sin2              # enveloppe de bruit gamma(t) : sin2 = pont brownien (dgamma=0 aux bords)
  sigma_bridge: 0.1        # echelle du bruit median du pont (gamma * rs * z)
  per_channel_noise: true  # (conserve pour compat ; la normalisation par rs est desormais systematique)
  t_dist: uniform          # distribution du temps d'entrainement. options: uniform, logit_normal, beta
  sigma_t: 1.2             # ecart-type du temps si t_dist = logit_normal
  use_residual: false      # <-- VRAI PONT ESPACE-CHAMP (source = IDW, pas x0=0)
  cfg_prob: 0.1            # proba de dropout du conditionnement a l'entrainement (0 = desactive)
  cfg_scale: 1.0           # echelle de guidance a l'inference (1 = desactive)
  # Echantillonnage SDE (ensemble/UQ) : garder ode pour cette premiere validation.
  sampler: ode             # ode (deterministe) | sde (ensemble score-based, Euler-Maruyama)
  learn_score: false       # tete denoiser eta=E[z|x_t] ; requis pour sde
  lambda_score: 1.0        # poids de la perte de denoising ||eta - z||^2
  eps_schedule: gamma      # coeff de diffusion eps(t) : gamma | const | linear
  eps0: 0.1                # echelle de eps(t) (bas : le SDE surdiffusait a 1.0)
  n_sde_steps: 32          # pas d'integration Euler-Maruyama

training:
  epochs: 200                    # parite budget avec FAM
  lr: 5.0e-4
  weight_decay: 5.0e-4
  val_every: 10
  seed: 42
  loss: shock_weighted_rel_mse   # options: mse, rel_mse, shock_weighted_mse, shock_weighted_rel_mse, sliced_wasserstein
  shock_weight_factor: 1.0       # poids des zones de choc dans la loss (0 = uniforme)
  lambda_enthalpy: 0.0           # physique a l'entrainement (ponderee par t) ; 0 = desactive
  schedule: cosine               # options: cosine, constant
  warmup_epochs: 20
  grad_clip: 5.0                 # clipping de la norme du gradient (0 = desactive)
  save_best: true
  batch_size: 32                 # parite budget avec FAM/DAM
  ema_decay: 0.9995
  train_fraction: 1.0            # fraction des donnees d'entrainement utilisee
  preload: true
