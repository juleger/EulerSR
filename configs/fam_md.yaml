model: fam
data_root: data/

# FAM mono-geometrie (diamond), multi-resolution : LR h=0.1 et h=0.2 vues a
# l'entrainement. Reglages entrainement identiques a fam_sd.yaml.
#
# Repro : uv run python train.py --config configs/fam_md.yaml --run_name fam_md

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  levels: [0.05, 0.1]     # niveaux de pooling multi-echelle internes
  embed_dim: 96
  cond_dim: 96            # dimension du vecteur de conditionnement
  t_dim: 64               # dimension de l'embedding du temps de flow
  n_heads: 3
  n_hr_blocks: 2          # blocs d'attention a pleine resolution HR
  n_global_blocks: 3      # blocs d'attention globale au niveau grossier
  mlp_ratio: 4
  k_pool: 9               # voisins kNN pour le pooling
  k_up: 6                 # voisins kNN pour l'upsampling
  k_self: 9               # voisins kNN pour la self-attention
  k_cond: 6               # voisins kNN pour le conditionnement
  use_lr_grad: true       # ajoute les gradients LR en features d'entree
  use_bf16: true
  coord_norm: object      # centre/echelle sur corde+centre obstacle (cf euler/meshing)

flow:
  n_steps: 12             # pas d'integration ODE a l'inference
  use_residual: true      # predit le residu sur la baseline IDW
  n_samples: 4            # echantillons moyennes par prediction
  n_val_gen: 16           # nombre de cas evalues en validation
  sample_seed: 42
  t_dist: logit_normal    # distribution du temps d'entrainement. options: logit_normal, uniform, beta
  sigma_t: 1.2            # ecart-type du temps si t_dist = logit_normal
  cfg_prob: 0.1           # proba de dropout du conditionnement a l'entrainement (0 = desactive)
  cfg_scale: 1.0          # echelle de guidance a l'inference (1 = desactive)
  learned_res_scale: true  # res_scale predite depuis Mach/AoA/LR/geometrie
  lambda_res_scale: 0.1   # poids de la loss auxiliaire qui entraine la tete

# Une seule geometrie mais deux branches de resolution LR.
datasets:
  - name: diamond
    lr_res:         [0.1, 0.2]
    weight:         [1,   1]
    train_fraction: [1.0, 1.0]

training:
  epochs: 200
  lr: 5.0e-4
  weight_decay: 5.0e-4
  val_every: 20
  seed: 42
  loss: shock_weighted_rel_mse   # options: mse, rel_mse, shock_weighted_mse, shock_weighted_rel_mse, w2
  shock_weight_factor: 1.0       # poids des zones de choc dans la loss (0 = uniforme)
  lambda_enthalpy: 0.01          # poids de la perte de conservation d'enthalpie (0 = desactive)
  lambda_endpoint: 0.0           # poids de la loss d'endpoint (0 = desactive)
  lambda_endpoint_warmup_epochs: 20  # rampe lineaire 0 -> lambda_endpoint
  schedule: cosine               # options: cosine, constant
  warmup_epochs: 20
  grad_clip: 4.0                 # clipping de la norme du gradient (0 = desactive)
  save_best: true
  batch_size: 12
  ema_decay: 0.9995
  train_fraction: 1.0
  preload: true
  mach_range: [0.7, 3.0]         # store processed regenere jusqu'a Mach 3
