model: mlp_corrector

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  k: 6
  hidden_dims: [256, 256, 128]
  use_lr_grad: true
  use_residual: true

training:
  epochs: 400
  lr: 3.0e-4
  weight_decay: 1.0e-4
  val_every: 10
  seed: 42
  loss: rel_mse
  lambda_phys: 0.0
  schedule: cosine
  grad_clip: 1.0
  save_best: true
  batch_size: 16
