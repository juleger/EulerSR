model: dam
data_root: data/

resolution:
  hr: 0.025
  lr: 0.1

architecture:
  levels: [0.05, 0.1]
  embed_dim: 96
  cond_dim: 96
  n_heads: 3
  n_hr_blocks: 3
  n_global_blocks: 4
  mlp_ratio: 4
  k_pool: 9
  k_up: 6
  k_self: 12
  k_cond: 6
  use_lr_grad: true
  use_bf16: true
  use_geom_cond: false
  n_geoms: 2

# Entraînement multi-branche : une branche = (géométrie, résolution_LR).
datasets:
  - name: diamond
    lr_res:         [0.1, 0.2]
    weight:         [1.0, 0.5]
    train_fraction: [1.0, 0.5]

  - name: naca0012
    lr_res:         [0.1, 0.2]
    weight:         [1.0, 0.5]
    train_fraction: [1.0, 0.5]

training:
  epochs: 150
  lr: 5.0e-4
  weight_decay: 5.0e-4
  val_every: 10
  seed: 42
  loss: shock_weighted_rel_mse
  lambda_enthalpy: 0.0
  schedule: cosine
  warmup_epochs: 20
  grad_clip: 1.0
  save_best: true
  batch_size: 16
  ema_decay: 0.9995
  train_fraction: 1.0
  preload: true
