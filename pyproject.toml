[project]
name = "GenerativePDE"
version = "0.1.0"
description = "Generative PDE solvers and neural operators using JAX"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12",
    "matplotlib>=3.9",
    "meshio>=5.3.5",
    "meshpy>=2023.1.1",
    "jax[cuda12]==0.4.38; sys_platform == 'linux'",
    "jax==0.4.38; sys_platform == 'darwin'",
    "scikit-learn>=1.6.1",
    "flax==0.10.4",
    "pyyaml>=6.0",
    "optax==0.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["Euler", "meshes"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
